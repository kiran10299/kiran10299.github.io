name: Refresh resume PDF

# Rebuilds resume.pdf from resume.html so the auto-calculated
# "years of experience" in the PDF stays current.
on:
  schedule:
    - cron: "0 3 1 * *"   # 1st of every month
  push:
    paths: ["resume.html"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji fonts-dejavu
      - name: Print resume.html to PDF
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox --no-pdf-header-footer \
            --virtual-time-budget=10000 --print-to-pdf=resume.pdf "file://$PWD/resume.html"
      - name: Commit if changed
        run: |
          git config user.name "resume-bot"
          git config user.email "actions@github.com"
          git add resume.pdf
          git diff --cached --quiet || (git commit -m "chore: refresh resume.pdf" && git push)
